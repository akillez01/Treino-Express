[project]
name = "treino-express-app"
version = "0.1.0"
description = "Backend do Treino Express — SaaS multi-tenant para academias"
authors = [
    { name = "akillez01", email = "achilles.oliveira.souza@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "pyjwt[crypto]>=2.9",
    "passlib[bcrypt]>=1.7",
    "stripe>=11.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` em defaults é o idioma padrão do FastAPI.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Consultas SQL longas em strings.
"app/api/v1/*.py" = ["E501"]
"scripts/*.py" = ["E501"]
"alembic/versions/*.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Um único event loop para toda a sessão: o engine global (app/db/session.py)
# mantém um pool de conexões asyncpg presas ao loop em que foram criadas.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
